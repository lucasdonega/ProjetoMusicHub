<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagina excluir artistas</title>
    <link rel="stylesheet" href="excluirartistas.css">
    <link rel="shortcut icon" href="../home/imgs/headder.png" type ="image/x-icon">
</head>
<body class=""excluir-artista>
    <header class="cabecalho">
        <a href="#">
            <img src="../home/imgs/headder.png" alt="Logo da pagina">
        </a>
   </header>
   <main class="conteudo">
    <section class="excluir">
        <div class="excluir-artistas">
            <img src="../home/imgs/ad35a714-13a4-45ea-b131-c7d58485ca61 4.png" alt="Logo music hub">
            <h1>Realmente deseja excluir este artista?</h1>
            <p>Essa ação não poderá ser desfeita futuramente</p>
        </div>
        <form>
            <div class="campo">
                 <label for="">Justifique aqui o motivo da exclusão do artista</label>
                <input  placeholder="Ex. Não cumpriu as diretrizes ">
            </div>
            <div class="mensagem-exclusao">
                <p>Ao selecionar a opção de exclusão, você apagará permanentemente o artista selecionado do sistema. Essa ação é irreversível e não poderá ser desfeita futuramente.
O artista será notificado dessa ação.</p>
            </div>
            <div class="botao-excluir">
    <button type="button" class="btn-excluir">Excluir</button>
  </div>
        </form>

    </section>
   </main>
    



</body>
</html>
