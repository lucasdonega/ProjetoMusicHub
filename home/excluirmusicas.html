<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Excluir música - MusicHub</title>

    <link rel="stylesheet" href="excluirmusicas.css">

    <link rel="shortcut icon"
        href="../home/imgs/headder.png"
        type="image/x-icon">
</head>

<body class="excluir-musica">

    <header class="cabecalho">

        <a href="#">
            <img src="../home/imgs/headder.png" alt="Logo MusicHub">
        </a>

        <span>MusicHub</span>

    </header>


    <main class="conteudo">

        <section class="excluir">


            <div class="excluir-musicas">

                <img
                    src="../home/imgs/ad35a714-13a4-45ea-b131-c7d58485ca61 4.png"
                    alt="Logo MusicHub"
                >

                <h1>Realmente deseja excluir esta música?</h1>

                <p>Essa ação não poderá ser desfeita futuramente</p>

            </div>


          

            <form>

                <div class="campo">

                    <label for="motivo">
                        Justifique aqui o motivo da exclusão da música
                    </label>

                    <input
                        type="text"
                        id="motivo"
                        name="motivo"
                        placeholder="Ex. Não cumpriu as diretrizes"
                    >

                </div>


               

                <div class="mensagem-exclusao">

                    <p>

                        Ao selecionar a opção de exclusão, você
                        <strong>apagará permanentemente a música</strong>
                        selecionada do sistema.
                        <strong>Essa ação é irreversível</strong>
                        e não poderá ser desfeita futuramente.

                        <br>

                        O artista será notificado dessa ação.

                    </p>

                </div>


               
                <div class="botao-excluir">

                    <button type="button" class="btn-excluir">
                        Excluir
                    </button>

                </div>

            </form>

        </section>

    </main>

</body>

</html>
