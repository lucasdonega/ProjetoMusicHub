<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - Minhas Playlists</title>
     <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="../img/icone-song.svg" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="minhas-playlists.css">

</head>

<body>


    <header class="cabecalho">
        <div class="logo">
           <img src="../img/icone-song.svg" alt="">
            <span class="texto-logo">MusicHub</span>
        </div>
    </header>


    <main class="conteudo-principal">
        <h1 class="titulo-pagina">Minhas playlists</h1>

        <!-- Botao Adicionar (Mais) -->
        <div class="container-adicionar">
            <button class="botao-adicionar" title="Adicionar nova playlist">
                <i class="fa-solid fa-plus"></i>
            </button>
        </div>

        <div class="lista-playlists">

            <!-- playlist 1 -->
            <div class="item-playlist">
                <div class="info-playlist">
                    <div class="container-imagem">
                        <img src="../img/art-doja.png" alt="Capa da Playlist 1" class="imagem-capa">
                    </div>
                    <span class="nome-playlist">Playlist 1</span>
                </div>
                <button class="botao-excluir" title="Excluir playlist">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>

            <!-- playlist 2 -->
            <div class="item-playlist">
                <div class="info-playlist">
                    <div class="container-imagem">
                        <img src="../img/art-billie.png" alt="Capa da Playlist 2" class="imagem-capa">
                    </div>
                    <span class="nome-playlist">Playlist 2</span>
                </div>
                <button class="botao-excluir" title="Excluir playlist">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>

            <!-- playlist 3 -->
            <div class="item-playlist">
                <div class="info-playlist">
                    <div class="container-imagem">
                        <img src="../img/art-jonh.png" alt="Capa da Playlist 3" class="imagem-capa">
                    </div>
                    <span class="nome-playlist">Playlist 3</span>
                </div>
                <button class="botao-excluir" title="Excluir playlist">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>

            <!-- playlist 4 -->
            <div class="item-playlist">
                <div class="info-playlist">
                    <div class="container-imagem">
                        <img src="../img/art-justin.png" alt="Capa da Playlist 4" class="imagem-capa">
                    </div>
                    <span class="nome-playlist">Playlist 4</span>
                </div>
                <button class="botao-excluir" title="Excluir playlist">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>

            <!-- playlist 5 -->
            <div class="item-playlist">
                <div class="info-playlist">
                    <div class="container-imagem">
                        <img src="../img/art-sabrina.png" alt="Capa da Playlist 2" class="imagem-capa">
                    </div>
                    <span class="nome-playlist">Playlist 2</span>
                </div>
                <button class="botao-excluir" title="Excluir playlist">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>

            <!-- playlist 6 -->
            <div class="item-playlist">
                <div class="info-playlist">
                    <div class="container-imagem">
                        <img src="../img/art-kemdrick.png" alt="Capa da Playlist 3" class="imagem-capa">
                    </div>
                    <span class="nome-playlist">Playlist 3</span>
                </div>
                <button class="botao-excluir" title="Excluir playlist">
                    <i class="fa-regular fa-trash-can"></i>
                </button>
            </div>

        </div>
    </main>

</body>

</html>
